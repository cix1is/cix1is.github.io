<style>

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #2b0030, #4a0055);
    animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.intro {
    font-size: 18px;
    max-width: 500px;
    padding: 0 20px;
    opacity: 0.9;
    margin-top: 40px;
}

.profile-pic {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    margin-top: 20px;
    border: 4px solid white;
    animation: float 4s ease-in-out infinite;
    transition: 0.3s ease;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0px); }
}

.profile-pic:hover {
    transform: scale(1.07);
}

h1 {
    font-size: 42px;
    margin: 15px 0 5px 0;
}

.role {
    font-size: 20px;
    opacity: 0.85;
}

.buttons {
    display: flex;
    gap: 20px;
    margin-top: 25px;
}

.buttons a {
    text-decoration: none;
    color: white;
    font-size: 26px;
    padding: 14px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    transition: 0.3s ease;
}

.buttons a:hover {
    background: white;
    color: #4a0055;
    transform: scale(1.15);
}

/* Skript Card */
.skript-card {
    margin-top: 60px;
    width: 90%;
    max-width: 700px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 25px;
    display: flex;
    align-items: flex-start;
    gap: 20px;
    backdrop-filter: blur(8px);
    transition: 0.3s ease;
}

.skript-card:hover {
    transform: scale(1.02);
    background: rgba(255, 255, 255, 0.12);
}

.skript-icon {
    width: 80px;
    height: 80px;
    border-radius: 15px;
    object-fit: cover;
}

.skript-content {
    text-align: left;
    width: 100%;
}

.skript-content h2 {
    margin: 0 0 10px 0;
}

.skript-content p {
    margin: 0 0 20px 0;
    opacity: 0.9;

/* Projects */
.projects-title {
    margin-bottom: 10px;
    font-size: 18px;

.project-link {
    display: block;
    text-decoration: none;
    color: white;
    background: rgba(255,255,255,0.12);
    padding: 10px 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    transition: 0.3s ease;
}

.project-link:hover {
    background: white;
    color: #4a0055;
    transform: translateX(5px);
